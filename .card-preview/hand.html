<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Mão de 6</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #111; }
      .phone {
        width: 390px;
        height: 844px;
        background: #07070c;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        position: relative;
        overflow: hidden;
      }
      .title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1.4px;
        padding: 54px 16px 8px;
      }
      .enemy {
        margin: 0 16px;
        border: 1px solid rgba(233, 56, 56, 0.7);
        border-radius: 8px;
        padding: 8px;
        display: grid;
        grid-template-columns: 48px 1fr;
        gap: 8px;
        background: #12080c;
      }
      .portrait {
        width: 48px; height: 48px; border-radius: 4px;
        background: linear-gradient(160deg, #ff2ec4, #243b8f);
      }
      .enemyName { font-weight: 800; letter-spacing: 0.6px; font-size: 14px; }
      .hpRow { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
      .hpLabel { font-size: 10px; color: #a6b4bf; }
      .bars { display: flex; gap: 3px; flex: 1; }
      .bar { height: 7px; flex: 1; background: #e93838; border-radius: 1px; }
      .hpCount { font-size: 12px; }
      .sub { font-size: 11px; color: #a6b4bf; margin-top: 2px; }
      .hint { text-align: center; color: #a6b4bf; font-size: 13px; margin: 16px 16px 8px; }
      .slots { display: flex; justify-content: center; gap: 10px; }
      .slot {
        width: 108px; height: 92px;
        border: 1px dashed rgba(255,255,255,0.22);
        border-radius: 10px; position: relative;
      }
      .idx { position: absolute; top: 6px; left: 8px; font-size: 12px; font-weight: 700; }
      .trayHead {
        display: flex; justify-content: space-between;
        padding: 14px 16px 8px; color: #a6b4bf; font-size: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        padding: 0 12px;
      }
      .card {
        background: #100d14;
        border: 1px solid #3a2a38;
        border-radius: 10px;
        padding: 6px 6px 8px;
        position: relative;
        min-height: 168px;
      }
      .info {
        position: absolute; top: 4px; right: 4px;
        width: 16px; height: 16px; border-radius: 99px;
        border: 1px solid #f2c14e; color: #f2c14e;
        font-size: 10px; font-weight: 800;
        display: flex; align-items: center; justify-content: center;
        background: #07070c;
      }
      .art {
        height: 58px; border-radius: 6px; overflow: hidden;
        background: #0c1a33;
        display: flex; align-items: center; justify-content: center;
      }
      .art img { width: 100%; height: 100%; object-fit: cover; }
      .name { margin-top: 4px; font-size: 11px; font-weight: 800; letter-spacing: 0.3px; }
      .stars { color: #f2c14e; font-size: 10px; letter-spacing: 1px; line-height: 1.2; }
      .type { font-size: 9px; font-weight: 800; letter-spacing: 0.4px; margin-top: 1px; }
      .attack { color: #e93838; }
      .defense { color: #3cf6ff; }
      .heal { color: #7dffb2; }
      .faces { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
      .face {
        min-width: 16px; height: 16px; padding: 0 2px;
        border-radius: 3px; border: 1px solid rgba(255,255,255,0.22);
        background: #07070c; font-size: 9px; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
      }
      .fixed {
        margin-top: 6px; text-align: center;
        color: #7dffb2; font-size: 11px; font-weight: 800; letter-spacing: 0.6px;
        padding: 4px 0; border-radius: 4px;
        background: rgba(125,255,178,0.1);
      }
      .ready {
        margin: 14px 16px 0; text-align: center; padding: 13px;
        border: 1px solid #ff2ec4; border-radius: 3px;
        color: #ff2ec4; letter-spacing: 3px; font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="phone" id="hand">
      <div class="title">PREPARAÇÃO</div>
      <div class="enemy">
        <div class="portrait"></div>
        <div>
          <div class="enemyName">INIMIGO 1</div>
          <div class="hpRow">
            <span class="hpLabel">PV</span>
            <div class="bars">
              <i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i>
              <i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i>
            </div>
            <span class="hpCount">10/10</span>
          </div>
          <div class="sub">Rola 2 dados</div>
        </div>
      </div>
      <div class="hint">Escolha 3 dados</div>
      <div class="slots">
        <div class="slot"><span class="idx">1</span></div>
        <div class="slot"><span class="idx">2</span></div>
        <div class="slot"><span class="idx">3</span></div>
      </div>
      <div class="trayHead">
        <span>Mão · 6</span>
        <span>Deck: 1 &nbsp; Morto: 0</span>
      </div>
      <div class="grid">
        <div class="card">
          <div class="info">i</div>
          <div class="art"><img src="d8_real.jpg" alt="" /></div>
          <div class="name">LÂMINA</div>
          <div class="stars">★★★</div>
          <div class="type attack">ATAQUE · D8</div>
          <div class="faces">
            <span class="face">0</span><span class="face">0</span><span class="face">1</span><span class="face">1</span>
            <span class="face">2</span><span class="face">2</span><span class="face">3</span><span class="face">4</span>
          </div>
        </div>
        <div class="card">
          <div class="info">i</div>
          <div class="art">
            <svg width="46" height="46" viewBox="0 0 64 64"><rect x="6" y="6" width="52" height="52" rx="8" fill="#3A1018" stroke="#E93838" stroke-width="3"/></svg>
          </div>
          <div class="name">CORTE</div>
          <div class="stars">★★</div>
          <div class="type attack">ATAQUE · D6</div>
          <div class="faces">
            <span class="face">0</span><span class="face">1</span><span class="face">1</span>
            <span class="face">2</span><span class="face">2</span><span class="face">3</span>
          </div>
        </div>
        <div class="card">
          <div class="info">i</div>
          <div class="art">
            <svg width="46" height="46" viewBox="0 0 64 64"><polygon points="32,4 60,58 4,58" fill="#3A1018" stroke="#E93838" stroke-width="3"/></svg>
          </div>
          <div class="name">PONTA</div>
          <div class="stars">★</div>
          <div class="type attack">ATAQUE · D4</div>
          <div class="faces">
            <span class="face">1</span><span class="face">1</span><span class="face">1</span><span class="face">2</span>
          </div>
        </div>
        <div class="card">
          <div class="info">i</div>
          <div class="art">
            <svg width="46" height="46" viewBox="0 0 64 64"><rect x="6" y="6" width="52" height="52" rx="8" fill="#082028" stroke="#3CF6FF" stroke-width="3"/></svg>
          </div>
          <div class="name">MURO</div>
          <div class="stars">★★</div>
          <div class="type defense">DEFESA · D6</div>
          <div class="faces">
            <span class="face">0</span><span class="face">0</span><span class="face">1</span>
            <span class="face">1</span><span class="face">1</span><span class="face">2</span>
          </div>
        </div>
        <div class="card">
          <div class="info">i</div>
          <div class="art">
            <svg width="46" height="46" viewBox="0 0 64 64"><polygon points="32,4 60,58 4,58" fill="#082028" stroke="#3CF6FF" stroke-width="3"/></svg>
          </div>
          <div class="name">ESCUDO</div>
          <div class="stars">★</div>
          <div class="type defense">DEFESA · D4</div>
          <div class="faces">
            <span class="face">1</span><span class="face">1</span><span class="face">1</span><span class="face">1</span>
          </div>
        </div>
        <div class="card">
          <div class="info">i</div>
          <div class="art"><img src="heal_symbol.jpg" alt="" /></div>
          <div class="name">SUTURA</div>
          <div class="stars">★</div>
          <div class="type heal">CURA</div>
          <div class="fixed">CURA 2</div>
        </div>
      </div>
      <div class="ready">PRONTO</div>
    </div>
  </body>
</html>
